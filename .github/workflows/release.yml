name: release

# Установщики собираются по тегу версии (git tag v0.2.0 && git push origin v0.2.0)
# или вручную: Actions → release → Run workflow
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test

      # клиент OAuth можно зашить в сборку через секреты репозитория; без них приложение попросит его при запуске
      - name: Build installers
        run: npm run tauri build
        env:
          CALM_GOOGLE_CLIENT_ID: ${{ secrets.CALM_GOOGLE_CLIENT_ID }}
          CALM_GOOGLE_CLIENT_SECRET: ${{ secrets.CALM_GOOGLE_CLIENT_SECRET }}

      # пакет для Microsoft Store. Identity берётся из Partner Center → Product identity и
      # задаётся переменными репозитория (Settings → Variables): MSIX_IDENTITY_NAME,
      # MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY_NAME. Пока их нет, шаг пропускается.
      - name: Build MSIX for Microsoft Store
        if: vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        run: >
          ./scripts/build-msix.ps1
          -IdentityName "${{ vars.MSIX_IDENTITY_NAME }}"
          -Publisher "${{ vars.MSIX_PUBLISHER }}"
          -PublisherDisplayName "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calm-calendar-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/msix/*.msix

      # текст релиза — раздел этой версии из CHANGELOG.md; без него релиз не выпускаем
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/release-notes.mjs "${{ github.ref_name }}" > release-notes.md

      # для тега создаём релиз на GitHub с установщиками
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/msix/*.msix
