name: app-tests

# Тесты настоящего приложения: отладочная сборка на подставных данных под tauri-driver и msedgedriver.
# Без Google. Запуск вручную: Actions → app-tests → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: cargo install tauri-driver --locked

      # msedgedriver той же версии, что WebView2 на машине
      - name: Edge WebDriver
        shell: pwsh
        run: ./scripts/msedgedriver.ps1

      - name: Build the test app
        run: npm run build:app-e2e

      - name: App tests
        run: npm run test:app
