name: app-tests

# Tests of the real app: debug build on mock data under tauri-driver and msedgedriver.
# No Google. Runs on pull requests that change the app, every Monday, and by hand (Actions → app-tests → Run workflow)
on:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "e2e/app/**"
      - "scripts/msedgedriver.ps1"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.ts"
      - ".github/workflows/app-tests.yml"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: cargo install tauri-driver --locked

      # msedgedriver of the same version as WebView2 on the machine
      - name: Edge WebDriver
        shell: pwsh
        run: ./scripts/msedgedriver.ps1

      - name: Build the test app
        run: npm run build:app-e2e

      # the built app has to start and keep running on its own, otherwise the driver can't reach its window
      - name: Start the test app
        shell: pwsh
        run: |
          $app = Start-Process src-tauri\target\debug\calm-calendar.exe -PassThru
          Start-Sleep -Seconds 20
          $alive = -not $app.HasExited
          if ($alive) { Stop-Process -Id $app.Id -Force; "still running after 20 s" } else { "exited with code $($app.ExitCode)" }
          Get-Content "$env:LOCALAPPDATA\com.arseni.calmcalendar.e2e\logs\calm-calendar.log" -ErrorAction SilentlyContinue
          if (-not $alive) { exit 1 }

      # temporary: does WebView2 on the runner honour the remote debugging port the driver relies on
      - name: WebView2 remote debugging check
        continue-on-error: true
        shell: pwsh
        run: |
          "elevated: " + ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          "session: " + (Get-Process -Id $PID).SessionId
          foreach ($k in 'HKLM:\SOFTWARE\Policies\Microsoft\Edge', 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2', 'HKCU:\SOFTWARE\Policies\Microsoft\Edge') {
            if (Test-Path $k) { "policy $k"; Get-ItemProperty $k | Out-String }
          }
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9222"
          $app = Start-Process src-tauri\target\debug\calm-calendar.exe -PassThru
          Start-Sleep -Seconds 20
          try { (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:9222/json/version -TimeoutSec 5).Content } catch { "port 9222: $($_.Exception.Message)" }
          Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Select-Object -First 3 | ForEach-Object { $_.CommandLine }
          Get-ChildItem $env:LOCALAPPDATA, $env:TEMP -Recurse -Filter DevToolsActivePort -ErrorAction SilentlyContinue | ForEach-Object { "$($_.FullName): $(Get-Content $_.FullName -TotalCount 1)" }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force

      # msedgedriver writes a verbose log next to the test results: how it starts the app and waits for its WebView2
      - name: Verbose Edge WebDriver
        shell: pwsh
        run: |
          $wrapper = Join-Path $env:RUNNER_TEMP "msedgedriver-verbose.cmd"
          $driver = Resolve-Path e2e\.drivers\msedgedriver.exe
          Set-Content $wrapper "@`"$driver`" %* --verbose `"--log-path=$env:RUNNER_TEMP\msedgedriver.log`""
          Add-Content $env:GITHUB_ENV "CALM_NATIVE_DRIVER=$wrapper"

      - name: App tests
        timeout-minutes: 30
        run: npm run test:app

      - if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msedgedriver-log
          path: ${{ runner.temp }}/msedgedriver.log

      # the test app's own log: what the Rust side saw when a test failed or hung
      - if: failure() || cancelled()
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "APP_LOG=$env:LOCALAPPDATA\com.arseni.calmcalendar.e2e\logs"

      - if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-log
          path: ${{ env.APP_LOG }}
