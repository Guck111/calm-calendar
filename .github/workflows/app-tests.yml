name: app-tests

# Tests of the real app: debug build on mock data, msedgedriver attached to its WebView2.
# No Google. Runs on every pull request, every Monday, and by hand (Actions → app-tests → Run workflow).
# A pull request that doesn't change the app skips the "app" job; a job skipped by its condition
# counts as passed, so "app" can be a required check (a workflow skipped by a path filter would stay pending)
on:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: diff
        name: Does the pull request change the app
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          app='^(src/|src-tauri/|e2e/app/|scripts/msedgedriver\.ps1$|package(-lock)?\.json$|index\.html$|vite\.config\.ts$|\.github/workflows/app-tests\.yml$)'
          if git diff --name-only "origin/$BASE...HEAD" | grep -qE "$app"; then echo "app=true"; else echo "app=false"; fi | tee -a "$GITHUB_OUTPUT"

  app:
    needs: changes
    # if the check itself broke, run the tests rather than let the pull request through untested
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: npm ci
      # msedgedriver of the same version as WebView2 on the machine
      - name: Edge WebDriver
        shell: pwsh
        run: ./scripts/msedgedriver.ps1

      - name: Build the test app
        run: npm run build:app-e2e

      # the built app has to start and keep running on its own, otherwise the driver can't reach its window
      - name: Start the test app
        shell: pwsh
        run: |
          $app = Start-Process src-tauri\target\debug\calm-calendar.exe -PassThru
          Start-Sleep -Seconds 20
          $alive = -not $app.HasExited
          if ($alive) { Stop-Process -Id $app.Id -Force; "still running after 20 s" } else { "exited with code $($app.ExitCode)" }
          # its WebView2 processes outlive it and would hold the app's WebView2 data for the next start
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content "$env:LOCALAPPDATA\com.arseni.calmcalendar.e2e\logs\calm-calendar.log" -ErrorAction SilentlyContinue
          if (-not $alive) { exit 1 }

      # the runner runs everything as administrator, and WebView2 then ignores WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS:
      # the remote debugging port the tests attach to goes into the machine policy instead
      - name: WebView2 remote debugging port
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          New-Item $key -Force | Out-Null
          New-ItemProperty $key -Name "calm-calendar.exe" -Value "--remote-debugging-port=9339" -Force | Out-Null
          # msedgedriver's verbose log, kept when the tests fail
          Add-Content $env:GITHUB_ENV "CALM_DRIVER_LOG=$env:RUNNER_TEMP\msedgedriver.log"

      - name: App tests
        timeout-minutes: 30
        run: npm run test:app

      - if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msedgedriver-log
          path: ${{ runner.temp }}/msedgedriver.log

      # the test app's own log: what the Rust side saw when a test failed or hung
      - if: failure() || cancelled()
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "APP_LOG=$env:LOCALAPPDATA\com.arseni.calmcalendar.e2e\logs"

      - if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-log
          path: ${{ env.APP_LOG }}
