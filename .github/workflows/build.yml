name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # клиент OAuth можно зашить в сборку через секреты репозитория; без них приложение попросит его при запуске
      - name: Build installers
        run: npm run tauri build
        env:
          CALM_GOOGLE_CLIENT_ID: ${{ secrets.CALM_GOOGLE_CLIENT_ID }}
          CALM_GOOGLE_CLIENT_SECRET: ${{ secrets.CALM_GOOGLE_CLIENT_SECRET }}

      - uses: actions/upload-artifact@v4
        with:
          name: calm-calendar-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
