name: mutation

on:
  pull_request:
    paths: ["src/**", "src-tauri/**", "stryker.config.json", ".github/workflows/mutation.yml"]
  push:
    branches: [main]
    paths: ["src/**", "src-tauri/**", "stryker.config.json", ".github/workflows/mutation.yml"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Incremental mode re-tests only mutants in changed code and reuses the rest from the last main run
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-

      - name: Mutation tests (TypeScript)
        shell: bash
        run: npx stryker run --incremental ${{ github.event_name == 'schedule' && '--force' || '' }}

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stryker-report
          path: reports/mutation

  # Rust builds once per mutant: too slow for every push to main
  rust:
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked --version 27.1.0

      # Pull request: only mutants in the changed lines. Advisory while the crate score is low (34% in Nov 2026)
      - name: Mutation tests on the diff (Rust)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        working-directory: src-tauri
        run: |
          git diff --relative "origin/${{ github.base_ref }}...HEAD" > ../pr.diff
          cargo mutants --in-diff ../pr.diff

      # Weekly and manual run: the whole crate, a report without blocking (exit 2 = missed mutants, 3 = timeouts)
      - name: Mutation tests on the whole crate (Rust)
        if: github.event_name != 'pull_request'
        shell: bash
        working-directory: src-tauri
        run: cargo mutants || { code=$?; [ "$code" -eq 2 ] || [ "$code" -eq 3 ]; }

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-mutants-report
          path: src-tauri/mutants.out
