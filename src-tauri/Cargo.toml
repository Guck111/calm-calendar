[package]
name = "calm-calendar"
version = "0.2.0"
description = "Calendar for Windows without ads"
authors = ["Arseni"]
edition = "2024"

[lib]
# Суффикс _lib нужен, чтобы имя библиотеки не конфликтовало с бинарником на Windows
name = "calm_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
thiserror = "2"

# Токен входа хранится в системном хранилище паролей
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# скруглённые углы и без рамки для окна виджета (DWM)
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader"] }
# автозапуск сборки MSIX через StartupTask
windows = { version = "0.62", features = ["ApplicationModel", "ApplicationModel_Activation", "Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# На Linux пока без системного хранилища (только для разработки)
[target.'cfg(all(not(windows), not(target_os = "macos")))'.dependencies]
keyring = { version = "3" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
