[package]
name = "calm-calendar"
version = "0.14.1"
description = "Calendar for Windows without ads"
authors = ["Arseni"]
license = "MIT"
edition = "2024"

[lib]
# The _lib suffix is needed so the library name doesn't clash with the binary on Windows
name = "calm_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
# autostart of the regular build: the Run key of the current user only
auto-launch = "0.6"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
thiserror = "2"
tauri-plugin-log = "2"
# system-wide Windows hotkey for quick add
tauri-plugin-global-shortcut = "2"
log = "0.4"

# The sign-in token is stored in the system password store
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# rounded corners and no border for the widget window (DWM)
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader"] }
# autostart of the MSIX build via StartupTask, notifications with a "Join" button, the Store rating dialog
windows = { version = "0.62", features = ["ApplicationModel", "ApplicationModel_Activation", "Foundation", "Data_Xml_Dom", "UI_Notifications", "Services_Store", "Win32_Foundation", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# No system store on Linux for now (development only)
[target.'cfg(all(not(windows), not(target_os = "macos")))'.dependencies]
keyring = { version = "3" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.mutants]
inherits = "test"
debug = "none"

[dev-dependencies]
proptest = "1"
